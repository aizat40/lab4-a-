<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Output</title>
</head>
<body>
    <h2>Book Details</h2>
    <div id="output"></div>

    <script>
        async function loadBooks() {
            const outputDiv = document.getElementById('output');

            try {
                const response = await fetch('books.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const books = await response.json();
                const firstBookTitle = books[0].title;
                const secondBookAuthor = books[1].author;
                const firstBookGenres = `${books[0].title} — ${books[0].genres.join(', ')}`;
                const secondBookGenres = `${books[1].title} — ${books[1].genres.join(', ')}`;
                const resultText = `${firstBookTitle}; ${secondBookAuthor}; ${firstBookGenres}; ${secondBookGenres}.`;
                const paragraph = document.createElement('p');
                paragraph.textContent = resultText;
                outputDiv.appendChild(paragraph);

            } catch (error) {
                const errorMsg = document.createElement('p');
                errorMsg.textContent = "Sorry, we couldn't load the book information. (" + error.message + ")";
                errorMsg.style.color = "red";
                outputDiv.appendChild(errorMsg);
            }
        }
        loadBooks();
    </script>
</body>
</html>
