<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
</head>

<body>
    <div id="myElement">
        <p id="message">Welcome to my website!</p>
    </div>
    <button id="changeBtn" type="button">Change Message</button>

</body>

<script>
    document.addEventListener("click", changeMessage);
    function changeMessage() {
        document.getElementById("message").innerHTML = "Hello There!";
    }
</script>
</html>
